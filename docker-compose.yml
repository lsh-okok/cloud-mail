services:
  app:
    image: cloud-mail-app:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_BASE_PATH: ${APP_BASE_PATH:-}
    restart: unless-stopped
    init: false
    hostname: ${MAIL_HOST:?Set MAIL_HOST in .env}
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:-v1}
      DATA_ENCRYPTION_PREVIOUS_KEYS: ${DATA_ENCRYPTION_PREVIOUS_KEYS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      VERIFICATION_SMTP_ALLOW_CIDRS: ${VERIFICATION_SMTP_ALLOW_CIDRS:-}
      NODE_ROLE: primary
      MAIL_ENABLED: "true"
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST in .env}
      MAIL_DOMAINS: ${MAIL_DOMAINS:?Set MAIL_DOMAINS in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PORT: "3000"
      DATA_DIR: /data
      SQLITE_PATH: /data/cloud-mail.sqlite
      OBJECTS_DIR: /data/objects
      STATIC_DIR: /app/mail-worker/dist
      LMTP_PORT: "2525"
      POLICY_PORT: "10040"
      DOMAIN_MAP_PORT: "10041"
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_REQUIRE_TLS: "false"
      MAX_MESSAGE_BYTES: ${MAX_MESSAGE_BYTES:-26214400}
      MAIL_LOG_PATH: /var/log/postfix/postfix.log
      DKIM_SELECTOR: ${DKIM_SELECTOR:-mail}
      SMTP_TLS_CERT_FILE: ${SMTP_TLS_CERT_FILE:?Set SMTP_TLS_CERT_FILE in .env}
      SMTP_TLS_KEY_FILE: ${SMTP_TLS_KEY_FILE:?Set SMTP_TLS_KEY_FILE in .env}
      MAIL_LOG_MAX_BYTES: ${MAIL_LOG_MAX_BYTES:-104857600}
      MAIL_LOG_KEEP: ${MAIL_LOG_KEEP:-7}
    ports:
      - "${SMTP_BIND_ADDRESS:-0.0.0.0}:25:25"
    volumes:
      - app_data:/data
      - mail_spool:/var/spool/postfix
      - mail_logs:/var/log/postfix
      - dkim_keys:/etc/opendkim/keys
      - type: bind
        source: ${NPM_CERT_ROOT:?Set NPM_CERT_ROOT in .env}
        target: /certs
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "3000"
    networks:
      mail_internal:
      npm:
        aliases:
          - cloud-mail-app
    stop_grace_period: 120s
    security_opt:
      - no-new-privileges:true

networks:
  mail_internal:
    driver: bridge
    ipam:
      config:
        - subnet: ${MAIL_NETWORK_SUBNET:-172.30.89.0/24}
  npm:
    external: true
    name: ${NPM_NETWORK:?Set NPM_NETWORK in .env}

volumes:
  app_data:
  mail_spool:
  mail_logs:
  dkim_keys:
