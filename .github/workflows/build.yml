name: Build server and web client
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            mail-worker/pnpm-lock.yaml
            mail-vue/pnpm-lock.yaml
      - run: pnpm --dir mail-worker install --frozen-lockfile
      - run: pnpm --dir mail-vue install --frozen-lockfile
      - run: pnpm --dir mail-worker run build
      - run: pnpm --dir mail-worker test
      - run: pnpm --dir mail-vue run build
        env:
          VITE_BASE_URL: /api
          VITE_OUT_DIR: ../mail-worker/dist
      - name: Validate deployment scripts
        run: |
          for script in docker/*.sh docker/mail/*.sh; do
            if head -n 1 "$script" | grep -q bash; then bash -n "$script"; else sh -n "$script"; fi
          done
          docker compose --env-file .env.example config --quiet
      - name: Exercise Docker mail stack
        run: sh docker/smoke-test.sh

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: cloud-mail-image-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image reference
        id: ref
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if digest=$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}' 2>/dev/null); then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish tested commit
        id: image
        if: steps.ref.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ref.outputs.image }}:sha-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Promote current main and latest and record digest
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          IMAGE_DIGEST: ${{ steps.ref.outputs.digest || steps.image.outputs.digest }}
        run: |
          set -eu
          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            docker buildx imagetools create --tag "$IMAGE:main" --tag "$IMAGE:latest" "$IMAGE@$IMAGE_DIGEST"
            echo "Published main and latest: $IMAGE@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipped main and latest promotion: a newer main commit exists." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Commit image: $IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Fixed image: $IMAGE@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
